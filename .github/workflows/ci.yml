name: CI

on:
  push:
    branches: [main, directory]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Plugin validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.293
      - name: Validate marketplace and plugin
        run: |
          claude plugin validate --strict .
          claude plugin validate --strict .claude-plugin/plugin.json

  structure:
    name: Manifests, skill and eval cases
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.2
      - name: Check manifests, skill and eval cases
        shell: python
        run: |
          import json, pathlib, re, sys, yaml

          errors = []
          root = pathlib.Path(".")

          def frontmatter(path):
              text = path.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
              if not m:
                  errors.append(f"{path}: missing YAML frontmatter")
                  return {}, text
              return yaml.safe_load(m.group(1)) or {}, text[m.end():]

          plugin = json.loads((root / ".claude-plugin/plugin.json").read_text(encoding="utf-8"))
          market = json.loads((root / ".claude-plugin/marketplace.json").read_text(encoding="utf-8"))
          name = plugin.get("name", "")
          if not re.fullmatch(r"[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?", name):
              errors.append(f"plugin.json: name {name!r} is not lowercase kebab-case")
          if not re.fullmatch(r"\d+\.\d+\.\d+", plugin.get("version", "")):
              errors.append("plugin.json: version must be MAJOR.MINOR.PATCH")
          for key in ("description", "author", "license", "homepage", "repository"):
              if not plugin.get(key):
                  errors.append(f"plugin.json: missing {key}")
          for key in ("homepage", "repository", "supportUrl", "privacyPolicyUrl"):
              if plugin.get(key) and not plugin[key].startswith("https://"):
                  errors.append(f"plugin.json: {key} must be an https URL")
          icon = plugin.get("icon", "")
          if icon and not icon.startswith("https://") and not (root / icon).is_file():
              errors.append(f"plugin.json: icon {icon} not found")
          entries = [p.get("name") for p in market.get("plugins", [])]
          if entries != [name]:
              errors.append(f"marketplace.json: plugin entries {entries} must be [{name!r}]")

          skills = sorted((root / "skills").glob("*/SKILL.md"))
          if not skills:
              errors.append("no skills/<name>/SKILL.md found")
          for skill in skills:
              meta, body = frontmatter(skill)
              if meta.get("name") != skill.parent.name:
                  errors.append(f"{skill}: name must match its folder {skill.parent.name!r}")
              if not isinstance(meta.get("description"), str) or not meta["description"].strip():
                  errors.append(f"{skill}: description must be a non-empty string")
              elif len(meta["description"]) > 1024:
                  errors.append(f"{skill}: description is longer than 1024 characters")
              if not body.strip():
                  errors.append(f"{skill}: empty body")

          cases = sorted(p for p in (root / "evals").iterdir() if p.is_dir() and p.name != "results")
          if not cases:
              errors.append("evals: no cases found")
          for case in cases:
              prompt, spec = case / "prompt.md", case / "case.yaml"
              if spec.is_file():
                  data = yaml.safe_load(spec.read_text(encoding="utf-8")) or {}
                  if data.get("name") != case.name:
                      errors.append(f"{spec}: name must match its folder")
                  execution = data.get("execution") or {}
                  if not execution.get("prompt"):
                      errors.append(f"{spec}: missing execution.prompt")
                  if not data.get("graders"):
                      errors.append(f"{spec}: no graders")
                  for key in ("history_file", "scaffold_script"):
                      ref = (data.get("context") or {}).get(key)
                      if ref and not (case / ref).is_file():
                          errors.append(f"{spec}: {key} {ref} not found")
                  history = case / "history.jsonl"
                  if history.is_file():
                      for n, line in enumerate(history.read_text(encoding="utf-8").splitlines(), 1):
                          if line.strip():
                              try:
                                  json.loads(line)
                              except ValueError:
                                  errors.append(f"{history}:{n}: invalid JSON")
              elif prompt.is_file():
                  meta, body = frontmatter(prompt)
                  if not body.strip():
                      errors.append(f"{prompt}: empty prompt")
                  graders = sorted((case / "graders").glob("*.md"))
                  if not graders:
                      errors.append(f"{case}: no graders/*.md")
                  for grader in graders:
                      gmeta, gbody = frontmatter(grader)
                      if not gmeta.get("type") or not gbody.strip():
                          errors.append(f"{grader}: needs a type and criteria")
              else:
                  errors.append(f"{case}: needs prompt.md or case.yaml")

          for message in errors:
              print(f"::error::{message}")
          print(f"{len(skills)} skill(s), {len(cases)} eval case(s), {len(errors)} error(s)")
          sys.exit(1 if errors else 0)
      - name: Check shell syntax
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r -n1 bash -n

  directory:
    name: Directory rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check files, README, license and wording
        shell: python
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          import os, pathlib, re, subprocess, sys

          errors = []
          files = [pathlib.Path(f) for f in subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True).stdout.splitlines()]
          images = {".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg"}
          banned_files = {".DS_Store", "Thumbs.db", "desktop.ini"}

          if len(files) > 512:
              errors.append(f"{len(files)} files; the directory holds plugins with more than 512 files for review")
          for f in files:
              if f.name in banned_files or "__MACOSX" in f.parts:
                  errors.append(f"{f}: system file must not be committed")
              if f.suffix.lower() not in images and f.stat().st_size > 256 * 1024:
                  errors.append(f"{f}: larger than 256 KiB")
              if f.suffix.lower() in {".ico", ".pdf", ".zip", ".exe", ".bin"}:
                  errors.append(f"{f}: binary type the directory holds for review")
              if any(c in f.name for c in ':<>"|?*') or f.name.endswith((".", " ")):
                  errors.append(f"{f}: file name is not valid on Windows")
          lower = {}
          for f in files:
              key = str(f).lower()
              if key in lower:
                  errors.append(f"{f} and {lower[key]} differ only by case")
              lower[key] = f

          if os.environ.get("BRANCH") == "directory":
              for f in files:
                  if f.suffix.lower() in images:
                      errors.append(f"{f}: the directory branch must not contain images")

          readme = pathlib.Path("README.md")
          if not readme.is_file():
              errors.append("README.md missing")
          else:
              prose = re.sub(r"```.*?```", "", readme.read_text(encoding="utf-8"), flags=re.S)
              if len(prose.split()) < 40:
                  errors.append("README.md has fewer than 40 words outside code blocks")
          if not pathlib.Path("LICENSE").is_file():
              errors.append("LICENSE missing")

          pattern = re.compile(r"eviden|red[ -]?team", re.I)
          for f in files:
              if f.parts[:2] == (".github", "workflows") or f.suffix.lower() in images:
                  continue
              for n, line in enumerate(f.read_text(encoding="utf-8", errors="ignore").splitlines(), 1):
                  if pattern.search(line):
                      errors.append(f"{f}:{n}: banned wording")

          for message in errors:
              print(f"::error::{message}")
          print(f"{len(files)} files checked, {len(errors)} error(s)")
          sys.exit(1 if errors else 0)

  website:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check HTML structure, anchors and local links
        shell: python
        run: |
          import pathlib, sys
          from html.parser import HTMLParser

          site = pathlib.Path("website")
          pages = sorted(site.glob("*.html")) if site.is_dir() else []
          if not pages:
              print("No website to check")
              sys.exit(0)

          void = {"area", "base", "br", "col", "embed", "hr", "img", "input", "link", "meta", "source", "track", "wbr"}
          errors = []

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.stack, self.ids, self.anchors, self.refs = [], set(), [], []
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if a.get("id"):
                      if a["id"] in self.ids:
                          errors.append(f"duplicate id #{a['id']}")
                      self.ids.add(a["id"])
                  for key in ("href", "src"):
                      value = a.get(key)
                      if not value:
                          continue
                      if value.startswith("#"):
                          self.anchors.append(value[1:])
                      elif not value.startswith(("http://", "https://", "mailto:")):
                          self.refs.append(value)
                  if tag == "img" and "alt" not in a:
                      errors.append(f"img {a.get('src')} has no alt attribute")
                  if tag not in void:
                      self.stack.append((tag, self.getpos()[0]))
              def handle_endtag(self, tag):
                  if tag in void:
                      return
                  if not self.stack or self.stack[-1][0] != tag:
                      errors.append(f"line {self.getpos()[0]}: unexpected </{tag}>")
                      return
                  self.stack.pop()

          for page in pages:
              p = Page()
              p.feed(page.read_text(encoding="utf-8"))
              p.close()
              for tag, line in p.stack:
                  errors.append(f"{page}:{line}: <{tag}> is never closed")
              for anchor in p.anchors:
                  if anchor and anchor not in p.ids:
                      errors.append(f"{page}: link to missing #{anchor}")
              for ref in p.refs:
                  if not (page.parent / ref.split("#")[0]).resolve().is_file():
                      errors.append(f"{page}: {ref} not found")

          for message in errors:
              print(f"::error::{message}")
          print(f"{len(pages)} page(s), {len(errors)} error(s)")
          sys.exit(1 if errors else 0)
